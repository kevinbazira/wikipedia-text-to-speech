<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia TTS Service | WMF ML</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Wikimedia UI (WMUI) Design Tokens */
        :root {
            --wmui-color-base: #202122;
            --wmui-color-subtle: #72777d;
            --wmui-color-primary: #3366cc;
            --wmui-color-primary-hover: #2a4b8d;
            --wmui-color-border: #a2a9b1;
            --wmui-color-background: #eaecf0;
            --wmui-color-surface: #ffffff;
            --wmui-color-warning: #fed500;
            --wmui-color-error: #d33;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Lato, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: var(--wmui-color-base);
        }

        /* Wikimedia-style Header */
        .navbar-wm {
            background-color: var(--wmui-color-surface);
            border-bottom: 1px solid var(--wmui-color-border);
        }
        .wm-logo-text {
            font-family: 'Linux Libertine', 'Georgia', 'Times', serif;
            font-size: 1.5rem;
            color: var(--wmui-color-base);
            text-decoration: none;
        }
        .wm-logo-text span {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 1rem;
            color: var(--wmui-color-subtle);
            font-weight: 400;
            margin-left: 8px;
        }

        /* Wikipedia Article Headings */
        .wiki-heading {
            font-family: 'Linux Libertine', 'Georgia', 'Times', serif;
            border-bottom: 1px solid var(--wmui-color-border);
            padding-bottom: 0.25em;
            margin-bottom: 0.5em;
            color: var(--wmui-color-base);
        }

        /* WMUI Form Elements (Sharp edges, specific border colors) */
        .form-control-wm {
            border: 1px solid var(--wmui-color-border);
            border-radius: 2px;
            color: var(--wmui-color-base);
        }
        .form-control-wm:focus {
            border-color: var(--wmui-color-primary);
            box-shadow: 0 0 0 1px var(--wmui-color-primary);
        }

        /* WMUI Progressive Button (Primary Action) */
        .btn-progressive {
            background-color: var(--wmui-color-primary);
            color: white;
            border: 1px solid var(--wmui-color-primary);
            border-radius: 2px;
            font-weight: bold;
            transition: background-color 100ms;
        }
        .btn-progressive:hover {
            background-color: var(--wmui-color-primary-hover);
            color: white;
        }

        /* WMUI Quiet Button (Secondary Action) */
        .btn-quiet {
            background-color: transparent;
            color: var(--wmui-color-base);
            border: 1px solid var(--wmui-color-border);
            border-radius: 2px;
            font-weight: bold;
            transition: background-color 100ms;
        }
        .btn-quiet:hover {
            background-color: var(--wmui-color-background);
            color: var(--wmui-color-base);
        }

        /* Card Styling */
        .card-wm {
            border: 1px solid var(--wmui-color-border);
            border-radius: 2px;
            background-color: var(--wmui-color-surface);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .section-row {
            border-bottom: 1px solid var(--wmui-color-background);
        }
        .section-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <!-- WMF Navbar -->
    <nav class="navbar navbar-wm mb-4 py-3">
        <div class="container d-flex align-items-center">
            <!-- Authentic Serif Logo Text -->
            <a class="wm-logo-text" href="/">
                WIKIPEDIA <span>TTS Service (Prototype)</span>
            </a>
            <span class="badge bg-secondary rounded-pill">WMF ML Team</span>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container" style="max-width: 850px;">
        
        <!-- Welcome Heading -->
        <h1 class="wiki-heading fs-2">Generate article audio</h1>
        <p class="text-muted mb-4">Enter a Wikipedia article title (or multiple separated by a pipe <code>|</code>) to extract its text, normalize it, and generate high-quality audio segments.</p>

        <!-- Input Card -->
        <div class="card-wm p-4 mb-4">
            <label for="articleInput" class="form-label fw-bold">Article Title(s)</label>
            <div class="input-group input-group-lg mb-2">
                <input type="text" class="form-control form-control-wm bg-light fs-6" id="articleInput" placeholder="e.g. Earth | Python_(programming_language)">
                <button class="btn btn-progressive px-4" type="button" id="generateBtn" onclick="generateTTS()">
                    Queue Audio
                </button>
            </div>

            <!-- Loading Spinner (Hidden by default) -->
            <div id="loadingMsg" class="d-none mt-3">
                <div class="d-flex align-items-center text-primary" style="color: var(--wmui-color-primary) !important;">
                    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                    <strong>Queuing articles in the ML pipeline...</strong>
                </div>
            </div>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer"></div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        async function generateTTS() {
            const input = document.getElementById('articleInput').value;
            const generateBtn = document.getElementById('generateBtn');
            const loadingMsg = document.getElementById('loadingMsg');
            const resultsContainer = document.getElementById('resultsContainer');

            if (!input) {
                alert("Please enter an article title.");
                return;
            }

            // UI State: Loading
            generateBtn.disabled = true;
            loadingMsg.classList.remove('d-none');
            resultsContainer.innerHTML = "";

            try {
                // Call the FastAPI /generate endpoint
                const response = await fetch(`/generate?articles=${encodeURIComponent(input)}`, { method: 'POST' });
                const data = await response.json();
                
                let html = `<h2 class="wiki-heading fs-4 mt-5 mb-3">Queue Results <span class="badge bg-success ms-2 fs-6 fw-normal">${data.message}</span></h2>`;

                data.details.forEach(item => {
                    html += `<div class="card-wm mb-4">`;
                    
                    // Article Header (Uses Wiki Serif font)
                    html += `
                        <div class="p-3" style="background-color: #f8f9fa; border-bottom: 1px solid var(--wmui-color-border);">
                            <h3 class="wiki-heading border-0 mb-0 fs-5 pb-0">📄 ${item.article}</h3>
                        </div>
                        <div class="p-0">`;
                    
                    if (item.status === 'error') {
                        html += `<div class="p-3 text-danger fw-bold">❌ Error: ${item.message}</div></div></div>`;
                        return;
                    }

                    // Draw a row for every section
                    item.section_names.forEach(section => {
                        html += `
                            <div class="section-row d-flex flex-column flex-md-row justify-content-between align-items-md-center p-3">
                                <span class="fw-bold mb-2 mb-md-0" style="color: var(--wmui-color-base);">${section}</span>
                                <div style="min-width: 250px; text-align: right;" id="player-container-${item.article}-${section}">
                                    <button class="btn btn-quiet btn-sm px-3 w-100" onclick="loadAudio(this, '${item.article}', '${section}')">
                                        🔊 Check Status / Play
                                    </button>
                                </div>
                            </div>`;
                    });
                    html += `</div></div>`;
                });

                resultsContainer.innerHTML = html;
            } catch (err) {
                resultsContainer.innerHTML = `<div class="alert alert-danger" style="border-radius: 2px;">❌ API Error: Make sure the FastAPI server is running!</div>`;
            } finally {
                // UI State: Reset
                generateBtn.disabled = false;
                loadingMsg.classList.add('d-none');
            }
        }

        // Tries to load the audio. Replaces buttons smoothly with loading indicators or actual audio players.
        async function loadAudio(btnElement, article, section) {
            const originalText = btnElement.innerHTML;
            
            // UI State: Checking
            btnElement.disabled = true;
            btnElement.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Checking...`;
            
            const audioUrl = `/audio?article=${encodeURIComponent(article)}&section=${encodeURIComponent(section)}`;
            
            try {
                const res = await fetch(audioUrl);
                
                if (res.status === 404) {
                    // Audio not ready: Style as a Warning Badge (Wiki Yellow)
                    btnElement.style.backgroundColor = 'var(--wmui-color-warning)';
                    btnElement.style.borderColor = '#c8a900'; // Darker yellow border
                    btnElement.style.color = '#000';
                    btnElement.innerHTML = `⏳ Still Processing...`;
                    
                    setTimeout(() => {
                        // Reset button
                        btnElement.style.backgroundColor = '';
                        btnElement.style.borderColor = '';
                        btnElement.style.color = '';
                        btnElement.innerHTML = originalText;
                        btnElement.disabled = false;
                    }, 4000);

                } else if (res.ok) {
                    // Audio is ready: Render native audio player seamlessly
                    const playerContainer = document.getElementById(`player-container-${article}-${section}`);
                    playerContainer.innerHTML = `<audio controls autoplay class="w-100" src="${audioUrl}"></audio>`;
                }
            } catch (err) {
                // Network Error
                btnElement.style.backgroundColor = 'var(--wmui-color-error)';
                btnElement.style.color = '#fff';
                btnElement.innerHTML = `❌ Network Error`;
                
                setTimeout(() => {
                    btnElement.style.backgroundColor = '';
                    btnElement.style.color = '';
                    btnElement.innerHTML = originalText;
                    btnElement.disabled = false;
                }, 3000);
            }
        }
    </script>
</body>
</html>
