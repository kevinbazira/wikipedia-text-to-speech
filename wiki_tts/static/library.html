<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wikipedia TTS Audio Library | browse pre-generated spoken articles.">
    <title>Audio Library | Wikipedia TTS</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.2.2/css/dataTables.dataTables.min.css">
    <style>
        :root {
            --color-base: #202122;
            --color-secondary: #54595d;
            --color-link: #0645ad;
            --color-border: #a2a9b1;
            --color-bg-light: #f8f9fa;
            --color-bg-white: #ffffff;
            --color-primary: #3366cc;
            --color-primary-hover: #2a56b0;
            --font-serif: 'Georgia', 'Times New Roman', serif;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Lato, 'Helvetica Neue', Arial, sans-serif;
            --radius: 2px;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { font-size: 16px; -webkit-font-smoothing: antialiased; }
        body {
            margin: 0;
            font-family: var(--font-sans);
            color: var(--color-base);
            background-color: var(--color-bg-white);
            line-height: 1.6;
        }

        /* ─── Header ─── */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--color-bg-white);
            border-bottom: 1px solid var(--color-border);
        }
        .site-header-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--color-base);
        }
        .logo-icon {
            width: 38px; height: 38px;
            background: var(--color-bg-light);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            display: grid;
            place-items: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }
        .logo-text {
            font-family: var(--font-serif);
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.2;
        }
        .nav-links {
            margin-left: auto;
            display: flex;
            gap: 0.25rem;
        }
        .nav-link {
            color: var(--color-link);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 0.375rem 0.625rem;
            border-radius: var(--radius);
            transition: background-color 0.12s;
        }
        .nav-link:hover {
            background: #eaf3ff;
        }
        .nav-link.current {
            color: var(--color-base);
            cursor: default;
        }

        /* ─── Layout ─── */
        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem 1rem 3rem;
        }
        .page-title {
            font-family: var(--font-serif);
            font-size: clamp(1.6rem, 1.4rem + 0.5vw, 2rem);
            font-weight: 400;
            margin: 0 0 0.25rem;
            line-height: 1.25;
        }
        .page-subtitle {
            font-size: 0.9375rem;
            color: var(--color-secondary);
            margin: 0 0 1.5rem;
        }

        /* ─── DataTables overrides ─── */
        .dt-container {
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .dt-search { padding: 0.75rem 1rem; }
        .dt-search label {
            font-size: 0.875rem;
            font-weight: 600;
        }
        .dt-search input {
            padding: 0.5rem 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            font-size: 0.9375rem;
            font-family: var(--font-sans);
            min-width: 260px;
        }
        .dt-search input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: inset 0 0 0 1px var(--color-primary);
        }
        .dt-layout-row {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            color: var(--color-secondary);
        }
        table.dataTable {
            width: 100%;
            border-collapse: collapse;
        }
        table.dataTable th {
            text-align: left;
            padding: 0.625rem 1rem;
            font-size: 0.9375rem;
            font-weight: bold;
            color: var(--color-secondary);
            border-bottom: 1px solid var(--color-border);
            background: var(--color-bg-light);
            cursor: pointer;
        }
        table.dataTable th:hover {
            color: var(--color-base);
        }
        table.dataTable td {
            padding: 0.625rem 1rem;
            border-bottom: 1px solid #eaecf0;
            font-size: 0.9375rem;
            vertical-align: middle;
        }
        table.dataTable tbody tr:hover {
            background: #eaf3ff;
        }
        .dt-paging {
            padding: 0.5rem 0.75rem;
        }
        .dt-paging button {
            padding: 0.375rem 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            background: var(--color-bg-light);
            color: var(--color-base);
            font-family: var(--font-sans);
            font-size: 0.8125rem;
            cursor: pointer;
            margin: 0 0.125rem;
            transition: background 0.12s;
        }
        .dt-paging button:hover {
            background: #eaecf0;
        }
        .dt-paging button.current {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: #fff;
        }

        .article-link {
            color: var(--color-link);
            text-decoration: none;
            font-weight: 600;
        }
        .article-link:hover {
            text-decoration: underline;
        }
        .listen-link {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
        }
        .listen-link:hover {
            text-decoration: underline;
        }

        /* ─── Loading & empty ─── */
        .loading-msg, .empty-msg {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--color-secondary);
            font-size: 0.9375rem;
        }
        .error-msg {
            text-align: center;
            padding: 3rem 1rem;
            color: #dd3333;
            font-size: 0.9375rem;
        }

        /* ─── Footer ─── */
        .site-footer {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            border-top: 1px solid var(--color-border);
            font-size: 0.8125rem;
            color: var(--color-secondary);
            text-align: center;
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="site-header-inner">
        <a class="logo" href="/" aria-label="Wikipedia TTS Service home">
            <span class="logo-icon" aria-hidden="true">🗣</span>
            <span class="logo-text">Wikipedia TTS</span>
        </a>
        <nav class="nav-links">
            <a class="nav-link" href="/">Generate</a>
            <span class="nav-link current">Library</span>
        </nav>
    </div>
</header>

<main>
    <h1 class="page-title">Audio library</h1>
    <p class="page-subtitle">Browse all pre-generated Wikipedia article sections. Click Listen to open the full player with transcripts.</p>

    <table id="libraryTable" class="display" style="width:100%">
        <thead>
            <tr>
                <th>Article</th>
                <th>Sections</th>
                <th>Listen</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <div id="loadingMsg" class="loading-msg">Loading article catalogue…</div>
</main>

<footer class="site-footer">
    <p>Wikimedia Foundation · Machine Learning Team · Prototype</p>
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.2.2/js/dataTables.min.js"></script>
<script>
(async function() {
    'use strict';

    const tableEl = document.getElementById('libraryTable');
    const loadingEl = document.getElementById('loadingMsg');

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = String(str);
        return div.innerHTML;
    }

    try {
        const res = await fetch('/articles');
        if (!res.ok) throw new Error('Server responded with ' + res.status);

        const articles = await res.json();

        if (!articles.length) {
            loadingEl.className = 'empty-msg';
            loadingEl.textContent = 'No pre-generated audio found yet. Generate some articles first.';
            tableEl.style.display = 'none';
            return;
        }

        const tbody = tableEl.querySelector('tbody');
        articles.forEach(a => {
            const row = document.createElement('tr');

            const nameCell = document.createElement('td');
            nameCell.innerHTML = `<a class="article-link" href="https://en.wikipedia.org/wiki/${encodeURIComponent(a.safe_article)}" target="_blank" rel="noopener">${escapeHtml(a.article)}</a>`;

            const countCell = document.createElement('td');
            countCell.textContent = a.section_count;

            const listenCell = document.createElement('td');
            const listenUrl = `/?article=${encodeURIComponent(a.article)}`;
            listenCell.innerHTML = `<a class="listen-link" href="${listenUrl}">▶ Listen</a>`;

            row.appendChild(nameCell);
            row.appendChild(countCell);
            row.appendChild(listenCell);
            tbody.appendChild(row);
        });

        new DataTable('#libraryTable', {
            order: [[0, 'asc']],
            pageLength: 25,
            lengthMenu: [10, 25, 50, 100],
            language: {
                search: 'Search:',
                zeroRecords: 'No matching articles found.',
                info: 'Showing _START_ to _END_ of _TOTAL_ articles',
                infoEmpty: 'No articles match the search.',
                infoFiltered: '(filtered from _MAX_ total)',
            },
        });

        loadingEl.style.display = 'none';
        tableEl.style.display = '';

    } catch (err) {
        loadingEl.className = 'error-msg';
        loadingEl.textContent = 'Could not load article catalogue: ' + err.message;
    }
})();
</script>

</body>
</html>
