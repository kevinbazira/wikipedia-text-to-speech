<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia TTS Prototype</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Wikipedia TTS Service</span>
            <span class="navbar-text text-light small">WMF ML Team Prototype</span>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container" style="max-width: 900px;">
        
        <!-- Input Card -->
        <div class="card shadow-sm mb-4 border-0">
            <div class="card-body p-4">
                <h5 class="card-title mb-3">Generate Audio</h5>
                <p class="card-text text-muted">Enter a Wikipedia article title (or multiple separated by a pipe <code>|</code>) to extract and generate audio for its sections.</p>
                
                <div class="input-group input-group-lg mb-3">
                    <input type="text" class="form-control bg-light" id="articleInput" placeholder="e.g. Earth | Python_(programming_language)">
                    <button class="btn btn-primary px-4 fw-bold" type="button" id="generateBtn" onclick="generateTTS()">
                        Queue Audio
                    </button>
                </div>

                <!-- Loading Spinner (Hidden by default) -->
                <div id="loadingMsg" class="d-none text-center my-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted fw-bold">Queuing articles in the ML pipeline... Please wait.</p>
                </div>
            </div>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer"></div>

    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        async function generateTTS() {
            const input = document.getElementById('articleInput').value;
            const generateBtn = document.getElementById('generateBtn');
            const loadingMsg = document.getElementById('loadingMsg');
            const resultsContainer = document.getElementById('resultsContainer');

            if (!input) {
                alert("Please enter an article title.");
                return;
            }

            // UI State: Loading
            generateBtn.disabled = true;
            loadingMsg.classList.remove('d-none');
            resultsContainer.innerHTML = "";

            try {
                // Call the FastAPI /generate endpoint
                const response = await fetch(`/generate?articles=${encodeURIComponent(input)}`, { method: 'POST' });
                const data = await response.json();
                
                let html = `<h4 class="mb-3 text-secondary">Queue Results <span class="badge bg-success fs-6">${data.message}</span></h4>`;

                data.details.forEach(item => {
                    // Create a Bootstrap Card for each Article
                    html += `
                    <div class="card shadow-sm mb-4 border-0 overflow-hidden">
                        <div class="card-header bg-white py-3 border-bottom-0">
                            <h5 class="mb-0">📄 ${item.article}</h5>
                        </div>
                        <ul class="list-group list-group-flush border-top">`;
                    
                    if (item.status === 'error') {
                        html += `<li class="list-group-item text-danger py-3"> Error: ${item.message}</li></ul></div>`;
                        return; // Skip to next article
                    }

                    // Draw a row for every section
                    item.section_names.forEach(section => {
                        html += `
                            <li class="list-group-item d-flex justify-content-between align-items-center py-3 bg-light">
                                <span class="fw-bold text-dark">${section}</span>
                                <div style="min-width: 300px; text-align: right;">
                                    <button class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="loadAudio(this, '${item.article}', '${section}')">
                                        🔊 Check Status / Play
                                    </button>
                                </div>
                            </li>`;
                    });
                    html += `</ul></div>`;
                });

                resultsContainer.innerHTML = html;
            } catch (err) {
                resultsContainer.innerHTML = `<div class="alert alert-danger"> API Error: Make sure the FastAPI server is running!</div>`;
            } finally {
                // UI State: Reset
                generateBtn.disabled = false;
                loadingMsg.classList.add('d-none');
            }
        }

        // Tries to load the audio. Replaces alert() popups with smooth button transitions!
        async function loadAudio(btnElement, article, section) {
            const originalText = btnElement.innerHTML;
            
            // UI State: Checking
            btnElement.disabled = true;
            btnElement.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Checking...`;
            
            const audioUrl = `/audio?article=${encodeURIComponent(article)}&section=${encodeURIComponent(section)}`;
            
            try {
                const res = await fetch(audioUrl);
                
                if (res.status === 404) {
                    // Audio not ready: Show warning badge on the button for 4 seconds
                    btnElement.classList.replace('btn-outline-primary', 'btn-warning');
                    btnElement.classList.remove('btn-outline-primary'); // fallback
                    btnElement.innerHTML = `⏳ Still Processing...`;
                    
                    setTimeout(() => {
                        btnElement.classList.replace('btn-warning', 'btn-outline-primary');
                        btnElement.innerHTML = originalText;
                        btnElement.disabled = false;
                    }, 4000);

                } else if (res.ok) {
                    // Audio is ready: Replace the button with a full-width HTML5 Audio Player!
                    const playerContainer = btnElement.parentElement;
                    playerContainer.innerHTML = `<audio controls autoplay class="w-100" src="${audioUrl}"></audio>`;
                }
            } catch (err) {
                // Network Error
                btnElement.classList.replace('btn-outline-primary', 'btn-danger');
                btnElement.innerHTML = ` Network Error`;
                
                setTimeout(() => {
                    btnElement.classList.replace('btn-danger', 'btn-outline-primary');
                    btnElement.innerHTML = originalText;
                    btnElement.disabled = false;
                }, 3000);
            }
        }
    </script>
</body>
</html>
