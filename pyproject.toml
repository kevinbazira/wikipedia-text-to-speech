[project]
name = "wiki-tts"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Ignore the "Use of assert" security warning in test files
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"