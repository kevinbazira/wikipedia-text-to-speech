<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Wikipedia TTS Service — generate spoken article sections.">
    <title>Wikipedia TTS Service | WMF ML Team</title>
    <style>
        :root {
            --color-base: #202122;
            --color-secondary: #54595d;
            --color-link: #0645ad;
            --color-border: #a2a9b1;
            --color-bg-light: #f8f9fa;
            --color-bg-white: #ffffff;
            --color-primary: #3366cc;
            --color-primary-hover: #2a56b0;
            --color-danger: #dd3333;
            --color-danger-bg: #fee7e6;
            --color-danger-border: #efa6a6;
            --color-success: #14866d;
            --font-serif: 'Georgia', 'Times New Roman', serif;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Lato, 'Helvetica Neue', Arial, sans-serif;
            --radius: 2px;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { font-size: 16px; -webkit-font-smoothing: antialiased; }
        body {
            margin: 0;
            font-family: var(--font-sans);
            color: var(--color-base);
            background-color: var(--color-bg-white);
            line-height: 1.6;
        }

        /* ─── Header ─── */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--color-bg-white);
            border-bottom: 1px solid var(--color-border);
        }
        .site-header-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 0.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: var(--color-base);
        }
        .logo-icon {
            width: 38px; height: 38px;
            background: var(--color-bg-light);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            display: grid;
            place-items: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }
        .logo-text {
            font-family: var(--font-serif);
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: 1.2;
        }
        .logo-sub {
            display: block;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--color-secondary);
            margin-top: 1px;
        }

        /* ─── Layout ─── */
        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem 1rem 3rem;
        }
        .page-title {
            font-family: var(--font-serif);
            font-size: clamp(1.6rem, 1.4rem + 0.5vw, 2rem);
            font-weight: 400;
            margin: 0 0 0.25rem;
            line-height: 1.25;
        }
        .page-subtitle {
            font-size: 0.9375rem;
            color: var(--color-secondary);
            margin: 0 0 1.5rem;
        }

        /* ─── Panel ─── */
        .panel {
            background: var(--color-bg-white);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .panel-bleed {
            padding: 0;
        }

        /* ─── Forms ─── */
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
        }
        .form-hint {
            margin: 0.375rem 0 0;
            font-size: 0.8125rem;
            color: var(--color-secondary);
        }
        .form-hint code, kbd {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.875em;
            padding: 0.0625rem 0.25rem;
            background: var(--color-bg-light);
            border: 1px solid #eaecf0;
            border-radius: var(--radius);
        }
        kbd {
            box-shadow: 0 1px 0 rgba(0,0,0,0.08);
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
        }
        input[type="text"] {
            flex: 1 1 auto;
            min-width: 0;
            padding: 0.625rem 0.75rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            font-size: 1rem;
            color: var(--color-base);
            background: var(--color-bg-white);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input[type="text"]:hover { border-color: #72777d; }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: inset 0 0 0 1px var(--color-primary), 0 0 0 3px rgba(51,102,204,0.12);
        }

        /* ─── Buttons ─── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.625rem 1.25rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            background: var(--color-bg-light);
            color: var(--color-base);
            font-family: inherit;
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.12s, border-color 0.12s;
            white-space: nowrap;
        }
        .btn:hover { background: #eaecf0; }
        .btn:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }
        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .btn-primary {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: #fff;
        }
        .btn-primary:hover { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }
        .btn-quiet {
            background: transparent;
            border-color: var(--color-border);
        }
        .btn-quiet:hover { background: var(--color-bg-light); }
        .btn-sm {
            padding: 0.375rem 0.875rem;
            font-size: 0.875rem;
        }
        .btn-text {
            padding: 0.375rem 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--color-primary);
            background: transparent;
            border-color: transparent;
        }
        .btn-text:hover {
            background: #eaf3ff;
            border-color: #a6c8ff;
        }

        /* ─── Spinner ─── */
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Status bar (adapted from the clean first design) ─── */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            padding: 0.625rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            font-size: 0.875rem;
            min-height: 44px;
            margin-bottom: 1.5rem;
        }
        .status-bar.idle { background: var(--color-bg-light); color: var(--color-secondary); }
        .status-bar.active { background: #eaf3ff; border-color: #a6c8ff; color: #0b3d91; }
        .status-bar.active .spinner { border-color: #a6c8ff; border-top-color: #0b3d91; }
        .status-bar.error { background: var(--color-danger-bg); border-color: var(--color-danger-border); color: var(--color-danger); }
        .status-icon { display: inline-flex; flex-shrink: 0; }
        .status-icon svg { display: block; }

        /* ─── Results ─── */
        .results-container {
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .results-container.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .article-group {
            margin-bottom: 2.5rem;
        }
        .article-title {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 400;
            margin: 0 0 0.75rem;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid var(--color-border);
            line-height: 1.3;
        }

        /* ─── Section list ─── */
        .section-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: 0.875rem 1.25rem;
            border-bottom: 1px solid #eaecf0;
        }
        .section-row:last-child { border-bottom: none; }
        .section-name {
            font-size: 0.9375rem;
            font-weight: 600;
            word-break: break-word;
        }
        .section-action {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            min-width: 260px;
        }
        .checking-state {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--color-secondary);
        }
        .audio-player {
            width: 100%;
            height: 36px;
            display: block;
        }

        /* ─── Badges ─── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.2rem 0.625rem;
            font-size: 0.8125rem;
            font-weight: 600;
            border: 1px solid transparent;
            border-radius: var(--radius);
        }
        .badge-warning { background: #fff8e6; border-color: #fc3; color: #5a4a00; }
        .badge-error { background: #fee7e6; border-color: #d33; color: #9c0000; }

        /* ─── Footer ─── */
        .site-footer {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            border-top: 1px solid var(--color-border);
            font-size: 0.8125rem;
            color: var(--color-secondary);
            text-align: center;
        }

        /* ─── Responsive ─── */
        @media (max-width: 640px) {
            .input-row { flex-direction: column; }
            .input-row .btn { width: 100%; }
            .article-title { font-size: 1.25rem; }
            .section-row { flex-direction: column; align-items: flex-start; }
            .section-action { width: 100%; min-width: auto; justify-content: flex-start; }
            .section-action .btn, .section-action .audio-player { width: 100%; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="site-header-inner">
        <a class="logo" href="/" aria-label="Wikipedia TTS Service home">
            <span class="logo-icon" aria-hidden="true">🗣</span>
            <span>
                <span class="logo-text">Wikipedia TTS</span>
                <span class="logo-sub">Article audio generator</span>
            </span>
        </a>
    </div>
</header>

<main>
    <h1 class="page-title">Generate article audio</h1>
    <p class="page-subtitle">Enter a Wikipedia article title to extract, normalize, and synthesize speech.</p>

    <section class="panel">
        <label for="articleInput" class="form-label">Article title(s)</label>
        <div class="input-row">
            <input type="text" id="articleInput" placeholder="e.g. Earth | Python_(programming_language)" autocomplete="off">
            <button id="generateBtn" class="btn btn-primary" type="button">Generate</button>
        </div>
        <p class="form-hint">Press <kbd>Enter</kbd> to submit · Separate multiple titles with <code>|</code></p>
    </section>

    <!-- Single, unified status bar (mirrors the first design's pattern exactly) -->
    <div id="statusBar" class="status-bar idle" role="status" aria-live="polite">
        <span id="statusIcon" class="status-icon" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
            </svg>
        </span>
        <span id="statusText">Ready to generate.</span>
    </div>

    <div id="resultsContainer" class="results-container"></div>
</main>

<footer class="site-footer">
    <p>Wikimedia Foundation · Machine Learning Team · Prototype</p>
</footer>

<script>
(function() {
    'use strict';

    const els = {
        input: document.getElementById('articleInput'),
        btn: document.getElementById('generateBtn'),
        results: document.getElementById('resultsContainer'),
        statusBar: document.getElementById('statusBar'),
        statusIcon: document.getElementById('statusIcon'),
        statusText: document.getElementById('statusText'),
    };

    const ICONS = {
        idle: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
        error: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
        success: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
    };

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = String(str);
        return div.innerHTML;
    }

    function slugify(str) {
        return str.replace(/[^a-z0-9]/gi, '-').toLowerCase().replace(/^-+|-+$/g, '');
    }

    function actionId(article, section) {
        return 'a-' + slugify(article) + '-' + slugify(section);
    }

    function setLoading(isLoading) {
        els.btn.disabled = isLoading;
        els.input.disabled = isLoading;
    }

    function updateStatus(text, state) {
        els.statusText.textContent = text;
        els.statusBar.className = 'status-bar ' + state;

        if (state === 'active') {
            els.statusIcon.innerHTML = `<div class="spinner" aria-hidden="true"></div>`;
        } else if (state === 'error') {
            els.statusIcon.innerHTML = ICONS.error;
        } else if (state === 'success') {
            els.statusIcon.innerHTML = ICONS.success;
        } else {
            els.statusIcon.innerHTML = ICONS.idle;
        }
    }

    /* ─── Section row states ─── */
    function renderActionButton(container, article, section) {
        container.innerHTML = '';
        const btn = document.createElement('button');
        btn.className = 'btn btn-quiet btn-sm';
        btn.type = 'button';
        btn.innerHTML = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M8 5v14l11-7z"/>
            </svg>
            Check status`;
        btn.addEventListener('click', () => checkAudio(container, article, section));
        container.appendChild(btn);
    }

    function renderChecking(container) {
        container.innerHTML = `
            <div class="checking-state">
                <div class="spinner" aria-hidden="true"></div>
                <span>Checking…</span>
            </div>`;
    }

    function renderProcessingState(container, article, section) {
        container.innerHTML = '';
        const badge = document.createElement('span');
        badge.className = 'badge badge-warning';
        badge.textContent = 'Rendering audio…';

        const retry = document.createElement('button');
        retry.className = 'btn btn-text btn-sm';
        retry.type = 'button';
        retry.textContent = 'Retry';
        retry.addEventListener('click', () => checkAudio(container, article, section));

        container.appendChild(badge);
        container.appendChild(retry);
    }

    function renderPlayer(container, url) {
        container.innerHTML = '';
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.className = 'audio-player';
        audio.src = url;
        container.appendChild(audio);
        audio.play().catch(() => {});
    }

    function renderNetworkError(container, article, section) {
        container.innerHTML = '';
        const badge = document.createElement('span');
        badge.className = 'badge badge-error';
        badge.textContent = 'Network error';

        const retry = document.createElement('button');
        retry.className = 'btn btn-text btn-sm';
        retry.type = 'button';
        retry.textContent = 'Retry';
        retry.addEventListener('click', () => checkAudio(container, article, section));

        container.appendChild(badge);
        container.appendChild(retry);
    }

    async function checkAudio(container, article, section) {
        renderChecking(container);
        const url = `/audio?article=${encodeURIComponent(article)}&section=${encodeURIComponent(section)}`;

        try {
            const res = await fetch(url);
            if (res.status === 404) {
                renderProcessingState(container, article, section);
            } else if (res.ok) {
                renderPlayer(container, url);
            } else {
                throw new Error('Status ' + res.status);
            }
        } catch (err) {
            renderNetworkError(container, article, section);
        }
    }

    /* ─── Main generation flow ─── */
    async function generate() {
        const raw = els.input.value.trim();

        if (!raw) {
            updateStatus('Please enter at least one article title.', 'error');
            els.input.focus();
            return;
        }

        updateStatus('Queuing articles in the ML pipeline…', 'active');
        setLoading(true);
        els.results.innerHTML = '';
        els.results.classList.remove('is-visible');

        try {
            const res = await fetch(`/generate?articles=${encodeURIComponent(raw)}`, { method: 'POST' });
            if (!res.ok) throw new Error(`Server responded with ${res.status}`);
            const data = await res.json();

            // Compute totals for a clean one-line summary
            let totalSections = 0;
            data.details.forEach(d => {
                if (d.status !== 'error' && Array.isArray(d.section_names)) {
                    totalSections += d.section_names.length;
                }
            });

            const aWord = data.details.length === 1 ? 'article' : 'articles';
            updateStatus(`Queued ${totalSections} section${totalSections !== 1 ? 's' : ''} from ${data.details.length} ${aWord}.`, 'success');

            renderResults(data);
        } catch (err) {
            updateStatus(`Error: ${err.message}. Make sure the FastAPI server is running.`, 'error');
        } finally {
            setLoading(false);
        }
    }

    function renderResults(data) {
        const frag = document.createDocumentFragment();

        data.details.forEach(item => {
            const group = document.createElement('section');
            group.className = 'article-group';

            const title = document.createElement('h2');
            title.className = 'article-title';
            title.textContent = item.article;
            group.appendChild(title);

            const panel = document.createElement('div');
            panel.className = 'panel panel-bleed';

            if (item.status === 'error') {
                const err = document.createElement('div');
                err.className = 'checking-state';
                err.style.padding = '1rem 1.25rem';
                err.style.color = 'var(--color-danger)';
                err.innerHTML = `<strong>Error:</strong> ${escapeHtml(item.message)}`;
                panel.appendChild(err);
            } else if (Array.isArray(item.section_names)) {
                item.section_names.forEach((section, idx) => {
                    const row = document.createElement('div');
                    row.className = 'section-row';
                    if (idx === item.section_names.length - 1) row.style.borderBottom = 'none';

                    const name = document.createElement('span');
                    name.className = 'section-name';
                    name.textContent = section;

                    const action = document.createElement('div');
                    action.className = 'section-action';
                    action.id = actionId(item.article, section);

                    renderActionButton(action, item.article, section);

                    row.appendChild(name);
                    row.appendChild(action);
                    panel.appendChild(row);
                });
            }

            group.appendChild(panel);
            frag.appendChild(group);
        });

        els.results.appendChild(frag);
        requestAnimationFrame(() => els.results.classList.add('is-visible'));
    }

    /* ─── Events ─── */
    els.btn.addEventListener('click', generate);
    els.input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            generate();
        }
        if (e.key === 'Escape') {
            els.input.value = '';
            els.input.focus();
        }
    });

    els.input.focus();
})();
</script>

</body>
</html>
